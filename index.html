<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src https://wnircustmcvwjlkvtyur.supabase.co wss://wnircustmcvwjlkvtyur.supabase.co https://raw.githubusercontent.com; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1446a0">
<title>Spanje 2031</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#08193a);--ink:light-dark(#0f1f3d,#eef3fb);--muted:light-dark(#4a5a78,#a9b8d3);--card:light-dark(#f1f5fc,#10295a);--line:light-dark(#d5e0f1,#24477a);--blue:#1446a0;--bl:light-dark(#1446a0,#8fb3ff);--sun:#f5b400;--ok:light-dark(#1b7a45,#5fd08f);--bad:light-dark(#b42318,#ff8a80);--field:light-dark(#ffffff,#0b2149)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,48px)}h2{font-size:clamp(24px,3.4vw,30px)}h3{font-size:18px}
.band{padding:20px max(4vw,14px)}.wrap{max-width:1100px;margin:0 auto}
.hero{background:linear-gradient(160deg,#1a55bd,#0b2a66);color:#fff;padding-top:calc(20px + env(safe-area-inset-top))}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.hero p{color:#d8e4fb;margin:.5em 0 0}.big{color:var(--sun);font-variant-numeric:tabular-nums}
.pic svg{width:100%;height:auto;display:block;border-radius:16px}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:8px max(4vw,14px);padding-top:calc(8px + env(safe-area-inset-top))}
.top b{font:600 18px Fraunces,serif;flex:1}.top .btn{background:#ffffff22}
.dot{width:10px;height:10px;border-radius:50%;background:#9fb2d6;flex:none}.dot.ok{background:#5fd08f}.dot.err{background:#ff8a80}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:-30px;position:relative}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi{background:var(--bg);box-shadow:0 10px 30px #0b2a6622}.card{margin-top:14px}
.v{font:700 clamp(28px,5vw,38px)/1.1 Fraunces,serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.res{font:700 clamp(26px,5vw,36px)/1.1 Fraunces,serif;color:var(--bl);white-space:nowrap;font-variant-numeric:tabular-nums}
.lbl{color:var(--muted);font-size:14px}.sm{font-size:13px;color:var(--muted)}
.bar{height:11px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 5px}.bar i{display:block;height:100%;background:var(--sun);border-radius:9px}.bar.b i{background:var(--blue)}.bar.g i{background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px;margin-top:16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:5px;min-height:138px}
.tile:active{transform:scale(.98)}.tile svg{width:28px;height:28px;stroke:var(--bl);fill:none;stroke-width:1.8}
.tile b{font:600 16px/1.2 Fraunces,serif}.tile small{color:var(--muted);font-size:13px;margin-top:auto}
.btn{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}.btn.red{background:var(--bad)}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--blue);flex:none}input[type=range]{padding:0;accent-color:var(--blue)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 130px}
.f label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
ul.list{list-style:none;padding:0;margin:6px 0 0}ul.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}ul.list li:last-child{border:0}
li.done .tt{text-decoration:line-through;color:var(--muted)}.tt{flex:1;cursor:pointer}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap;margin:2px 4px 0 0}.badge.late{background:var(--bad);color:#fff}.badge.soon{background:var(--sun);color:#000}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:500}.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input{min-height:38px;padding:6px 8px}.scroll{overflow-x:auto}
tr.now td{background:light-dark(#fff4cc,#3a3108)}
.ok{color:var(--ok);font-weight:700}.warn{color:light-dark(#a35a00,#ffc857);font-weight:700}
.fig{position:relative;height:220px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.mbars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:130px;margin-top:10px}
.mbars div{background:var(--blue);border-radius:5px 5px 0 0;min-height:2px;position:relative}.mbars div.off{background:var(--line)}
.mlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.tl{border-left:3px solid var(--blue);margin-left:8px;padding-left:16px}.tl .yr{position:relative;margin-top:16px}.tl .yr:before{content:"";position:absolute;left:-25px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--sun);border:3px solid var(--bg)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.photos img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line);display:block}
.mood{columns:2 160px;column-gap:10px;margin-top:10px}.mood figure{break-inside:avoid;margin:0 0 10px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}.mood img{width:100%;display:block;min-height:80px;background:var(--line)}.mood figcaption{padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.word{background:linear-gradient(135deg,#fff3c4,#ffe08a);color:#3b2a00;border:0}
.plan{width:100%;height:auto;touch-action:none;background:light-dark(#e9f3dc,#1b3320);border-radius:12px;border:1px solid var(--line);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px}
#sheetBg{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end;justify-content:center}#sheetBg.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f1f3d;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90vw}
.upd{background:var(--sun);color:#000;padding:10px max(4vw,14px);display:flex;gap:10px;align-items:center}.upd span{flex:1}
.auth{max-width:440px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 18px 40px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.celebrate{background:linear-gradient(135deg,#ffd666,#f5b400);color:#2b1d00;border:0}
@media(max-width:600px){.hero .wrap{grid-template-columns:1fr}.kpis{margin-top:14px}.hide-s{display:none}}
</style>
</head>

<div id="sheetBg"><div id="sheet"></div></div>

function bnbSeason(){const dim=[31,28,31,30,31,30,31,31,30,31,30,31];const m=S.season.map((s,i)=>s.open?S.bnb.kamers*(+s.prijs||0)*((+s.bez||0)/100)*dim[i]:0);const omzet=m.reduce((a,b)=>a+b,0);return{m,omzet,pm:omzet*(1-S.bnb.kost/100)/12}}
function projection(extra){const w=S.whatif;let ing=+S.acc.ing||0,dg=+S.acc.degiro||0;const r=(+w.rend||0)/100/12;const d=new Date();d.setDate(1);const end=vertrek();
  while(d<end){d.setMonth(d.getMonth()+1);ing+=+S.inleg.ing||0;dg=dg*(1+r)+(+S.inleg.degiro||0)+(+extra||0);if(w.bonus&&d.getMonth()===11)dg+=2000}
  return{ing,dg,total:ing+dg+(+S.acc.pokemon||0),div:dg*((+w.yld||0)/100)/12}}
const WORD=()=>{const n=Math.floor((Date.now()-new Date(2026,0,1))/864e5);return WORDS[((n%WORDS.length)+WORDS.length)%WORDS.length]};
function getRef(path){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++){const s=k[i];o=s[0]==='#'?o.find(x=>x.id===s.slice(1)):o[s];if(o==null)return null}return{o,k:k[k.length-1]}}

const SB={c:null,uid:null,email:'',hid:null,members:[],ready:false,chan:null,state:'local'};
let dirty=(()=>{try{return localStorage.getItem('sp-dirty')==='1'}catch(e){return false}})(),timer=null,writing=false;
const VAULT={on:false,key:null,doc:null};
const te=new TextEncoder(),td=new TextDecoder();
const b64e=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function vKek(secret,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(secret.normalize('NFKC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vUnwrap(w,kek){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(w.iv)},kek,b64d(w.ct)))}
const vImport=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function vEnc(obj){const iv=rnd(12);return{enc:1,iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,te.encode(JSON.stringify(obj))))}}
async function vDec(d){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(d.iv)},VAULT.key,b64d(d.ct))))}
function setSync(st){SB.state=st;const d=$('sync');if(d)d.className='dot '+(st==='ok'?'ok':st==='err'?'err':'')}
function save(){saveLocal();dirty=true;try{localStorage.setItem('sp-dirty','1')}catch(e){}checkMilestones();scheduleDeadlines();clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){if(!SB.hid||!SB.ready||writing||!dirty)return;if(VAULT.on&&!VAULT.key)return;writing=true;setSync('');
  try{const r=await SB.c.from('docs').select('data').eq('household_id',SB.hid).eq('key','spanje').maybeSingle();if(r.error)throw r.error;
    if(r.data&&r.data.data){const srv=r.data.data.enc?await vDec(r.data.data):r.data.data;const m=merge3(S,srv);if(hj(m)!==hj(S)){S=Object.assign(defaults(),m);saveLocal();render()}}
    const snap=clone(S);let data=snap;if(VAULT.key)data=await vEnc(snap);
    const w=await SB.c.from('docs').upsert({household_id:SB.hid,key:'spanje',data,updated_by:SB.uid,updated_at:new Date().toISOString()},{onConflict:'household_id,key'});if(w.error)throw w.error;
    setBase(snap);if(hj(snap)===hj(S)){dirty=false;try{localStorage.setItem('sp-dirty','0')}catch(e){}}setSync('ok')}
  catch(e){setSync('err');setTimeout(flush,15000)}finally{writing=false;if(dirty)setTimeout(flush,1500)}}
async function pull(){const r=await SB.c.from('docs').select('data').eq('household_id',SB.hid).eq('key','spanje').maybeSingle();if(r.error)throw r.error;
  if(!r.data||!r.data.data){dirty=true;return flush()}
  const d=r.data.data;if(d.enc&&!VAULT.key)return;const srv=d.enc?await vDec(d):d;
  if(!BASE&&!localStorage.getItem('sp-synced')){S=Object.assign(defaults(),srv)}else if(dirty){S=Object.assign(defaults(),merge3(S,srv))}else S=Object.assign(defaults(),srv);
  try{localStorage.setItem('sp-synced','1')}catch(e){}
  setBase(srv);saveLocal();render();if(dirty)flush();else setSync('ok')}
async function initSB(){if(!window.supabase){render();return}
  SB.c=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'spanje-auth'}});
  const {data}=await SB.c.auth.getSession();
  if(data&&data.session)await afterLogin(data.session);
  else if(!localStorage.getItem('sp-local'))showAuth();else render()}
async function afterLogin(ses){SB.uid=ses.user.id;SB.email=ses.user.email||'';
  const r=await SB.c.from('members').select('household_id').eq('user_id',SB.uid).limit(1);
  const hid=r.data&&r.data[0]&&r.data[0].household_id;
  if(!hid){showAuth('Dit account heeft nog geen huishouden. Maak of koppel eerst een huishouden in Stuiver.');return}
  SB.hid=hid;const mm=await SB.c.from('members').select('user_id,name').eq('household_id',hid);if(mm.data)SB.members=mm.data;
  const v=await SB.c.from('docs').select('data').eq('household_id',hid).eq('key','_vault').maybeSingle();
  if(v.data&&v.data.data){VAULT.on=true;VAULT.doc=v.data.data;const c=localStorage.getItem('spanje-hk-'+hid);if(c){try{VAULT.key=await vImport(b64d(c))}catch(e){}}if(!VAULT.key){showVault();return}}
  await connect()}
async function connect(){SB.ready=true;render();setSync('');
  try{await pull()}catch(e){setSync('err')}
  if(SB.chan)SB.c.removeChannel(SB.chan);
  SB.chan=SB.c.channel('sp-'+SB.hid).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'household_id=eq.'+SB.hid},p=>{const r=p.new;if(r&&r.key==='spanje'&&r.updated_by!==SB.uid&&!writing)pull().catch(()=>{})}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SB.ready)pull().catch(()=>{})});
  window.addEventListener('online',()=>{if(SB.ready)flush()})}
function showAuth(msg){$('app').innerHTML=`<div class="auth"><h1>Spanje 2031</h1><p class="lbl">Log in met je <b>Stuiver-account</b>. Dan zien jullie allebei dezelfde gegevens.</p>

function showVault(msg){$('app').innerHTML=`<div class="auth"><h1>Gegevens versleuteld</h1><p class="lbl">Vul het <b>kluiswachtwoord</b> van jullie huishouden in (hetzelfde als in Stuiver). Dit hoeft maar één keer per apparaat.</p>
  <div class="card"><div class="f"><label for="vPw">Kluiswachtwoord</label><input id="vPw" type="password" autocomplete="off"></div><button class="btn" style="width:100%;margin-top:14px" id="vBtn" data-act="vault">Openen</button>
  <details style="margin-top:12px"><summary class="sm">Kluiswachtwoord vergeten? Gebruik de herstelcode</summary><div class="f" style="margin-top:8px"><input id="vRc" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"></div><button class="btn ghost" style="width:100%;margin-top:8px" data-act="vaultrc">Openen met herstelcode</button></details>
  <div class="err" id="aErr">${esc(msg||'')}</div></div><button class="btn ghost" style="width:100%;margin-top:14px" data-act="logout">Uitloggen</button></div>`}
async function doLogin(){const email=$('aMail').value.trim(),password=$('aPw').value;if(!email||!password){$('aErr').textContent='Vul je e-mailadres en wachtwoord in.';return}
  $('aBtn').disabled=true;$('aBtn').textContent='Bezig…';const {data,error}=await SB.c.auth.signInWithPassword({email,password});
  if(error){$('aBtn').disabled=false;$('aBtn').textContent='Inloggen';$('aErr').textContent=/invalid/i.test(error.message)?'E-mailadres of wachtwoord klopt niet.':error.message;return}
  try{localStorage.removeItem('sp-local')}catch(e){}await afterLogin(data.session)}
async function doVault(rc){const d=VAULT.doc;const b=$('vBtn');b.disabled=true;b.textContent='Openen…';
  try{let raw;if(rc){const c=$('vRc').value.toUpperCase().replace(/[^A-Z0-9]/g,'');raw=await vUnwrap(d.wr,await vKek(c,b64d(d.salt),d.iterR||100000))}else raw=await vUnwrap(d.wp,await vKek($('vPw').value,b64d(d.salt),d.iter));
    VAULT.key=await vImport(raw);try{localStorage.setItem('spanje-hk-'+SB.hid,b64e(raw))}catch(e){}toast('Ontgrendeld');await connect()}
  catch(e){b.disabled=false;b.textContent='Openen';$('aErr').textContent=rc?'Deze herstelcode klopt niet.':'Dit kluiswachtwoord klopt niet.'}}
async function doLogout(){try{if(SB.chan)SB.c.removeChannel(SB.chan);await SB.c.auth.signOut()}catch(e){}
  try{Object.keys(localStorage).filter(k=>k.startsWith('spanje-hk-')||k.startsWith('sp-')).forEach(k=>localStorage.removeItem(k))}catch(e){}
  S=defaults();BASE=null;dirty=false;SB.uid=SB.hid=null;SB.ready=false;VAULT.key=null;closeSheet();showAuth()}

const IMGURL={};let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('spanje-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return idbP}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('i').objectStore('i').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(k,v){try{const db=await idb();db.transaction('i','readwrite').objectStore('i').put(v,k)}catch(e){}}
function compress(file,max=1280){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('foto')),'image/jpeg',.82)};im.onerror=()=>rej(new Error('Dit is geen foto'));im.src=url})}
async function putImg(file){const blob=await compress(file);const id='i'+uid();await idbPut(id,blob);IMGURL[id]=URL.createObjectURL(blob);
  if(SB.hid){let body=new Uint8Array(await blob.arrayBuffer());if(VAULT.key){const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,body));body=new Uint8Array(12+ct.length);body.set(iv);body.set(ct,12)}
    const {error}=await SB.c.storage.from('spanje').upload(SB.hid+'/'+id,new Blob([body],{type:'application/octet-stream'}),{upsert:true});if(error)toast('Foto staat alleen op dit apparaat: '+error.message)}
  return id}
async function getImg(id){if(IMGURL[id])return IMGURL[id];let b=await idbGet(id);
  if(!b&&SB.hid){const {data,error}=await SB.c.storage.from('spanje').download(SB.hid+'/'+id);if(error||!data)return null;let u=new Uint8Array(await data.arrayBuffer());
    if(VAULT.key){try{u=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},VAULT.key,u.slice(12)))}catch(e){return null}}b=new Blob([u],{type:'image/jpeg'});idbPut(id,b)}
  if(!b)return null;return IMGURL[id]=URL.createObjectURL(b)}
function delImg(id){if(SB.hid)SB.c.storage.from('spanje').remove([SB.hid+'/'+id]).catch(()=>{})}
function pickPhotos(multi,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=async()=>{const ids=[];for(const f of i.files){try{ids.push(await putImg(f))}catch(e){toast(e.message)}}if(ids.length)cb(ids)};i.click()}
function loadImgs(){document.querySelectorAll('img[data-img]').forEach(el=>{getImg(el.dataset.img).then(u=>{if(u)el.src=u})})}

function checkMilestones(){const t=total();MILESTONES.forEach(m=>{if(t>=m&&!S.ms.includes(m)){S.ms.push(m);const txt=m===GOALT?'Spaardoel 2031 gehaald!':'Mijlpaal: '+E(m)+' gespaard!';toast(txt);S.celebrate=m;if(isApp()&&Android.notify)try{Android.notify(7000+MILESTONES.indexOf(m),'Spanje 2031',txt)}catch(e){}}})}
function scheduleDeadlines(){if(!isApp()||!Android.schedule)return;let prev=[];try{prev=JSON.parse(localStorage.getItem('sp-sched')||'[]')}catch(e){}const ids=[];
  tasks().forEach(t=>{const m=S.tmeta[t.id];if(!m||!m.due||isDone(t.id))return;const at=new Date(m.due+'T09:00:00');at.setDate(at.getDate()-1);if(at<=new Date())return;const id=100000+(+hashStr(t.id)%800000);ids.push(id);
    try{Android.schedule(id,at.getTime(),'Morgen deadline: '+t.t,(m.who?m.who+' · ':'')+'Spanje 2031')}catch(e){}});
  prev.filter(i=>!ids.includes(i)).forEach(i=>{try{Android.cancel(i)}catch(e){}});try{localStorage.setItem('sp-sched',JSON.stringify(ids))}catch(e){}}

function lineChart(){const pts=S.hist.slice().sort((a,b)=>a.d<b.d?-1:1);return `<div class="fig" id="chart" data-chart="1"></div><div class="sm">Geel = jullie stand · blauw gestippeld = planlijn naar ${E(GOALT)}</div>`}
function drawChart(){const el=$('chart');if(!el)return;const W=el.clientWidth,H=el.clientHeight;const pts=S.hist.slice().sort((a,b)=>a.d<b.d?-1:1);if(!pts.length){el.innerHTML='';return}
  const t0=new Date(pts[0].d).getTime(),t1=vertrek().getTime(),max=Math.max(GOALT,...pts.map(p=>p.t))*1.08;const pl=46,pb=22,pr=10,pt=10;
  const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(1-v/max)*(H-pt-pb);
  let g='';for(let i=0;i<=4;i++){const v=max/4*i;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v/1000)}k</text>`}
  for(let yr=new Date(t0).getFullYear()+1;yr<=vertrek().getFullYear();yr++){const t=new Date(yr,0,1).getTime();if(t>t0&&t<t1)g+=`<text x="${x(t)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${W<420?"'"+String(yr).slice(2):yr}</text>`}
  const line=pts.map((p,i)=>(i?'L':'M')+x(new Date(p.d).getTime()).toFixed(1)+' '+y(p.t).toFixed(1)).join(' ');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}<path d="M${x(t0)} ${y(pts[0].t)} L${x(t1)} ${y(GOALT)}" stroke="var(--bl)" stroke-dasharray="5 5" fill="none" stroke-width="2"/><path d="${line}" stroke="#f5b400" stroke-width="3" fill="none"/>${pts.map(p=>`<circle cx="${x(new Date(p.d).getTime())}" cy="${y(p.t)}" r="4" fill="#f5b400"/>`).join('')}</svg>`}

sync:()=>{dirty=true;flush();pull().then(()=>toast('Gesynchroniseerd')).catch(()=>toast('Niet gelukt, probeer later'))},
update:()=>{if(!UPD)return;try{Android.installUpdate(UPD.apk);toast('Update wordt gedownload…')}catch(e){location.href=UPD.apk}},
checkupd:()=>{checkUpdate().then(()=>{if(!UPD)toast('Je hebt de nieuwste versie')})},notif:()=>{try{Android.requestNotifPermission();toast('Meldingen gevraagd')}catch(e){}},
close:closeSheet,clearcele:()=>{delete S.celebrate;save();render()},
addtask:id=>{const t=val('nt-'+id).trim();if(!t)return;S.custom.push({id:'u'+uid(),t,f:+val('nf-'+id),tile:id});save();render();toast('Taak toegevoegd')},
edittask:editTask,
savetask:id=>{const m={due:val('etD'),who:val('etW')};if(m.due||m.who)S.tmeta[id]=m;else delete S.tmeta[id];const c=S.custom.find(x=>x.id===id);if(c){c.t=val('etT')||c.t;c.f=+val('etF')||c.f}closeSheet();save();render()},
deltask:id=>{S.custom=S.custom.filter(x=>x.id!==id);S.done=S.done.filter(x=>x!==id);delete S.tmeta[id];closeSheet();save();render()},
adddiv:()=>{const a=parseFloat(val('dvA'));if(!a)return toast('Vul een bedrag in');S.divlog.push({id:'d'+uid(),d:val('dvD')||today(),amt:a,note:val('dvN')});save();render()},
deldiv:id=>{S.divlog=S.divlog.filter(x=>x.id!==id);save();render()},
niveau:id=>{S.niveau=id;save();render()},
addles:()=>{const m=+val('lsM');if(!m)return;S.lessen.push({id:'l'+uid(),d:val('lsD')||today(),min:m,note:val('lsN')});save();render()},
delles:id=>{S.lessen=S.lessen.filter(x=>x.id!==id);save();render()},
addreg:id=>{const n=(id||val('rgN')).trim();if(!n)return;S.regions.push({id:'r'+uid(),naam:n,s:{},note:''});save();render()},
delreg:id=>{S.regions=S.regions.filter(x=>x.id!==id);save();render()},
edittrip:editTrip,tripfoto:()=>{readTrip();pickPhotos(true,ids=>{draft.fotos.push(...ids);tripSheet()})},
tripdelfoto:id=>{readTrip();draft.fotos=draft.fotos.filter(f=>f!==id);delImg(id);tripSheet()},
savetrip:()=>{readTrip();const t=draft;delete t.nw;const i=S.trips.findIndex(x=>x.id===t.id);if(i>=0)S.trips[i]=t;else S.trips.push(t);closeSheet();save();render()},
deltrip:()=>{(draft.fotos||[]).forEach(delImg);S.trips=S.trips.filter(x=>x.id!==draft.id);closeSheet();save();render()},
editfinca:editFinca,fincafoto:()=>pickPhotos(false,ids=>{if(draft.foto)delImg(draft.foto);draft.foto=ids[0];$('fiFoto').innerHTML=`<img data-img="${ids[0]}" class="ph" style="width:120px" alt="">`;loadImgs()}),
savefinca:()=>{const g=k=>val('fi_'+k);const x={id:draft.id,foto:draft.foto,naam:g('naam'),regio:g('regio'),url:g('url'),prijs:+g('prijs')||0,grond:g('grond'),status:g('status'),note:g('note')};const i=S.fincas.findIndex(f=>f.id===x.id);if(i>=0)S.fincas[i]=x;else S.fincas.push(x);closeSheet();save();render()},
delfinca:id=>{const f=S.fincas.find(x=>x.id===id);if(f&&f.foto)delImg(f.foto);S.fincas=S.fincas.filter(x=>x.id!==id);closeSheet();save();render()},
editcomp:editComp,savecomp:id=>{const g=k=>val('cp_'+k);const x={id:id||'c'+uid(),naam:g('naam')||'B&B',regio:g('regio'),url:g('url'),prijs:+g('prijs')||0,bez:+g('bez')||0,note:g('note')};const i=S.comp.findIndex(c=>c.id===x.id);if(i>=0)S.comp[i]=x;else S.comp.push(x);closeSheet();save();render()},
delcomp:id=>{S.comp=S.comp.filter(x=>x.id!==id);closeSheet();save();render()},
addplan:type=>{const t=PLANTYPES[type];S.plan.items.push({id:'p'+uid(),type,x:Math.max(0,S.plan.w/2-t[2]/2),y:Math.max(0,S.plan.h/2-t[3]/2),w:t[2],h:t[3],label:''});save();render()},
saveplan:id=>{const it=S.plan.items.find(x=>x.id===id);it.label=val('plL');it.w=+val('plW')||it.w;it.h=+val('plH')||it.h;closeSheet();save();render()},
delplan:id=>{S.plan.items=S.plan.items.filter(x=>x.id!==id);closeSheet();save();render()},
moodf:id=>{S.moodF=id;saveLocal();render()},addmood:()=>{const cat=val('mdC');pickPhotos(true,ids=>{ids.forEach(img=>S.mood.push({id:'m'+uid(),img,cat,label:''}));save();render()})},
delmood:id=>{const m=S.mood.find(x=>x.id===id);if(m)delImg(m.img);S.mood=S.mood.filter(x=>x.id!==id);save();render()}};

/* ---------- render + events ---------- */
const app=$('app');let lastView=null;
function render(){if(!$('app'))return;if(SB.c&&!SB.uid&&!localStorage.getItem('sp-local')&&window.supabase){showAuth();return}
  const id=location.hash.slice(1),y=id===lastView?window.scrollY:0;app.innerHTML=V[id]?page(id):home();lastView=id;window.scrollTo(0,y);setSync(SB.state);drawChart();loadImgs()}
addEventListener('resize',()=>drawChart());
app.addEventListener('toggle',e=>{if(e.target.id==='qe')qOpen=e.target.open},true);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){e.preventDefault();A[a.dataset.act](a.dataset.id)}});
function bindVal(t){const r=getRef(t.dataset.bind);if(!r)return false;let v;if(t.dataset.t==='b')v=t.checked;else if(t.dataset.t==='s')v=t.value;else v=t.value===''?null:+t.value;
  if(v===null&&t.dataset.bind.startsWith('costs.'))delete r.o[r.k];else r.o[r.k]=v;return true}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.task){const id=t.dataset.task;S.done=t.checked?S.done.concat(id):S.done.filter(x=>x!==id);save();render();return}
  if(t.dataset.bind){if(t.dataset.bind.startsWith('regw.')){S.regw=S.regw||{}}if(t.dataset.bind.startsWith('col.v.')){const k=t.dataset.bind.split('.')[2];S.col.v[k]=S.col.v[k]||{}}
    if(bindVal(t)){save();if(!t.dataset.norr)render()}}});
document.addEventListener('submit',e=>{const m=e.target.closest('[data-form="money"]');if(!m)return;e.preventDefault();const v=n=>{const x=parseFloat(String(m.elements[n].value).replace(',','.'));return isNaN(x)?0:x};
  S.acc={ing:v('ing'),degiro:v('degiro'),pokemon:v('pokemon')};S.divi=v('divi');S.inleg={ing:v('iing'),degiro:v('ideg')};S.upd=today();
  S.hist=S.hist.filter(h=>h.d!==S.upd).concat({id:S.upd,d:S.upd,t:total()});qOpen=false;save();render();toast('Bedragen opgeslagen')});
/* plattegrond slepen */
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-pi]');if(!g)return;const svg=$('plan');const it=S.plan.items.find(x=>x.id===g.dataset.pi);const pt=svgPt(svg,e);drag={it,dx:pt.x-it.x,dy:pt.y-it.y,moved:false,g};g.setPointerCapture&&g.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const pt=svgPt($('plan'),e),it=drag.it;const nx=Math.max(0,Math.min(S.plan.w-it.w,pt.x-drag.dx)),ny=Math.max(0,Math.min(S.plan.h-it.h,pt.y-drag.dy));if(Math.abs(nx-it.x)+Math.abs(ny-it.y)>.3)drag.moved=true;it.x=Math.round(nx*2)/2;it.y=Math.round(ny*2)/2;
  const r=drag.g.querySelector('rect'),tx=drag.g.querySelector('text');r.setAttribute('x',it.x);r.setAttribute('y',it.y);tx.setAttribute('x',it.x+it.w/2);tx.setAttribute('y',it.y+it.h/2+1)});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.moved)save();else editPlan(d.it.id)});
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
addEventListener('hashchange',render);
render();initSB().catch(()=>render());setTimeout(checkUpdate,4000);scheduleDeadlines();
if(isApp()&&!localStorage.getItem('sp-notifasked')){try{Android.requestNotifPermission();localStorage.setItem('sp-notifasked','1')}catch(e){}}
</script>
