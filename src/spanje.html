:root{color-scheme:light dark;

.dot{width:9px;height:9px;border-radius:50%;background:#ffffffaa;flex:none}.top .dot{background:var(--line)}.dot.ok{background:#8fd18b}.dot.err{background:#ff9c84}

.kpi{background:var(--card);border-radius:22px;padding:16px}

.kpi.main{grid-column:1/-1}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}

@media(prefers-reduced-motion:reduce){.tile:active,.btn:active{transform:none}}
</style>

function taxCalc(){const s=bnbSeason(),n=Math.max(1,+S.tax.personen||1),winst=s.omzet*(1-S.bnb.kost/100),aut=(+S.tax.autonomo||0)*12;
  const base=Math.max(0,winst/n-aut),gen=Math.max(0,taxScale(base,GEN)-taxScale(Math.min(base,5550),GEN)),sav=taxScale((+S.divi||0)*12/n,SAV),tot=(gen+sav)*n;
  return{winst,aut:aut*n,gen:gen*n,sav:sav*n,tot,netPm:(winst-aut*n+(+S.divi||0)*12-tot)/12}}
function bnbSimple(){const b=S.bnb;const omzet=b.kamers*b.prijs*(b.bez/100)*b.mnd*30.4;return{omzet,pm:omzet*(1-b.kost/100)/12}}
const WORD=()=>{const n=Math.floor((Date.now()-new Date(2026,0,1))/864e5);return WORDS[((n%WORDS.length)+WORDS.length)%WORDS.length]};
function getRef(path){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++){const s=k[i];o=s[0]==='#'?o.find(x=>x.id===s.slice(1)):o[s];if(o==null)return null}return{o,k:k[k.length-1]}}

const VAULT={on:false,key:null,doc:null};
const te=new TextEncoder(),td=new TextDecoder();
const b64e=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function vKek(secret,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(secret.normalize('NFKC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vUnwrap(w,kek){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(w.iv)},kek,b64d(w.ct)))}
const vImport=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function vEnc(obj){const iv=rnd(12);return{enc:1,iv:b64e(iv),ct:b64e(await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,te.encode(JSON.stringify(obj))))}}
async function vDec(d){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(d.iv)},VAULT.key,b64d(d.ct))))}
function setSync(st){SB.state=st;if(st==='ok'){try{localStorage.setItem('sp-lastsync',String(Date.now()))}catch(e){}}const d=$('sync');if(d)d.className='dot '+(st==='ok'?'ok':st==='err'?'err':'');const t=$('synct');if(t)t.textContent=st==='err'?'synchroniseren mislukt, probeer later':syncText()}
function save(){saveLocal();dirty=true;try{localStorage.setItem('sp-dirty','1')}catch(e){}checkMilestones();scheduleDeadlines();clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){if(!SB.hid||!SB.ready||writing||!dirty)return;if(VAULT.on&&!VAULT.key)return;writing=true;setSync('');
  try{const r=await SB.c.from('docs').select('data').eq('household_id',SB.hid).eq('key','spanje').maybeSingle();if(r.error)throw r.error;
    if(r.data&&r.data.data){const srv=r.data.data.enc?await vDec(r.data.data):r.data.data;const m=merge3(S,srv);if(hj(m)!==hj(S)){S=Object.assign(defaults(),m);saveLocal();render()}}
    const snap=clone(S);let data=snap;if(VAULT.key)data=await vEnc(snap);
    const w=await SB.c.from('docs').upsert({household_id:SB.hid,key:'spanje',data,updated_by:SB.uid,updated_at:new Date().toISOString()},{onConflict:'household_id,key'});if(w.error)throw w.error;
    setBase(snap);if(hj(snap)===hj(S)){dirty=false;try{localStorage.setItem('sp-dirty','0')}catch(e){}}setSync('ok')}
  catch(e){setSync('err');setTimeout(flush,15000)}finally{writing=false;if(dirty)setTimeout(flush,1500)}}
async function pull(){const r=await SB.c.from('docs').select('data').eq('household_id',SB.hid).eq('key','spanje').maybeSingle();if(r.error)throw r.error;
  if(!r.data||!r.data.data){dirty=true;return flush()}
  const d=r.data.data;if(d.enc&&!VAULT.key)return;const srv=d.enc?await vDec(d):d;
  if(!BASE&&!localStorage.getItem('sp-synced')){S=Object.assign(defaults(),srv)}else if(dirty){S=Object.assign(defaults(),merge3(S,srv))}else S=Object.assign(defaults(),srv);
  try{localStorage.setItem('sp-synced','1')}catch(e){}
  setBase(srv);saveLocal();if(migrate()){save()}render();if(dirty)flush();else setSync('ok')}
async function initSB(){if(!window.supabase){render();return}
  SB.c=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'spanje-auth'}});

async function afterLogin(ses){SB.uid=ses.user.id;SB.email=ses.user.email||'';
  const r=await SB.c.from('members').select('household_id').eq('user_id',SB.uid).limit(1);
  const hid=r.data&&r.data[0]&&r.data[0].household_id;
  if(!hid){showAuth('Dit account heeft nog geen huishouden. Maak of koppel eerst een huishouden in Stuiver.');return}
  SB.hid=hid;const mm=await SB.c.from('members').select('user_id,name').eq('household_id',hid);if(mm.data)SB.members=mm.data;
  const v=await SB.c.from('docs').select('data').eq('household_id',hid).eq('key','_vault').maybeSingle();
  if(v.data&&v.data.data){VAULT.on=true;VAULT.doc=v.data.data;const c=localStorage.getItem('spanje-hk-'+hid);if(c){try{VAULT.key=await vImport(b64d(c))}catch(e){}}if(!VAULT.key){showVault();return}}
  await connect()}
async function connect(){SB.ready=true;render();setSync('');

  stuiverAuto();
  if(SB.chan)SB.c.removeChannel(SB.chan);
  SB.chan=SB.c.channel('sp-'+SB.hid).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'household_id=eq.'+SB.hid},p=>{const r=p.new;if(r&&r.key==='spanje'&&r.updated_by!==SB.uid&&!writing)pull().catch(()=>{})}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SB.ready)pull().catch(()=>{})});
  window.addEventListener('online',()=>{if(SB.ready)flush()})}

async function doLogin(){const email=$('aMail').value.trim(),password=$('aPw').value;if(!email||!password){$('aErr').textContent='Vul je e-mailadres en wachtwoord in.';return}
  $('aBtn').disabled=true;$('aBtn').textContent='Bezig…';const {data,error}=await SB.c.auth.signInWithPassword({email,password});

async function doVault(rc){const d=VAULT.doc;const b=$('vBtn');b.disabled=true;b.textContent='Openen…';
  try{let raw;if(rc){const c=$('vRc').value.toUpperCase().replace(/[^A-Z0-9]/g,'');raw=await vUnwrap(d.wr,await vKek(c,b64d(d.salt),d.iterR||100000))}else raw=await vUnwrap(d.wp,await vKek($('vPw').value,b64d(d.salt),d.iter));

const IMGURL={};let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('spanje-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return idbP}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('i').objectStore('i').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(k,v){try{const db=await idb();db.transaction('i','readwrite').objectStore('i').put(v,k)}catch(e){}}
function compress(file,max=1280){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('foto')),'image/jpeg',.82)};im.onerror=()=>rej(new Error('Dit is geen foto'));im.src=url})}
async function putImg(file){const blob=await compress(file);const id='i'+uid();await idbPut(id,blob);IMGURL[id]=URL.createObjectURL(blob);
  if(SB.hid){let body=new Uint8Array(await blob.arrayBuffer());if(VAULT.key){const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,body));body=new Uint8Array(12+ct.length);body.set(iv);body.set(ct,12)}
    const {error}=await SB.c.storage.from('spanje').upload(SB.hid+'/'+id,new Blob([body],{type:'application/octet-stream'}),{upsert:true});if(error)toast('Foto staat alleen op dit apparaat: '+error.message)}
  return id}
async function getImg(id){if(IMGURL[id])return IMGURL[id];let b=await idbGet(id);
  if(!b&&SB.hid){const {data,error}=await SB.c.storage.from('spanje').download(SB.hid+'/'+id);if(error||!data)return null;let u=new Uint8Array(await data.arrayBuffer());
    if(VAULT.key){try{u=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},VAULT.key,u.slice(12)))}catch(e){return null}}b=new Blob([u],{type:'image/jpeg'});idbPut(id,b)}
  if(!b)return null;return IMGURL[id]=URL.createObjectURL(b)}

t11:()=>`<h2>Reislogboek</h2>${S.trips.slice().sort((a,b)=>(a.van||'')<(b.van||'')?1:-1).map(t=>`<div class="card" data-act="edittrip" data-id="${t.id}" style="cursor:pointer"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(t.regio||'Reis')}</h3>${t.cijfer?`<span class="res" style="font-size:24px">${t.cijfer}</span>`:''}</div><div class="sm">${fmtD(t.van)}${t.tot?' – '+fmtD(t.tot):''}</div>${t.note?`<p style="margin:6px 0 0">${esc(t.note)}</p>`:''}${(t.fotos||[]).length?`<div class="photos">${t.fotos.slice(0,6).map(f=>`<img data-img="${f}" alt="">`).join('')}</div>`:''}</div>`).join('')||'<p class="lbl">Nog geen reizen. Leg elke oriëntatiereis vast met foto\'s en een cijfer.</p>'}<button class="btn" style="margin-top:14px" data-act="edittrip">Reis toevoegen</button>${tileTasks('t11')}`,
t12:()=>`<h2>Documenten Spanje</h2><p class="sm">Globale volgorde. Eisen en formulieren veranderen soms: check ze bij het Spaanse consulaat of de gemeente voordat je ze aanvraagt.</p>${bar(pct(DOCSTEPS.filter(d=>S.docs[d[0]]).length,DOCSTEPS.length),'g')}

t13:()=>{const c=S.col,tot=k=>COLROWS.reduce((a,[id])=>a+(+((c.v[id]||{})[k])||0),0);return `<h2>Levensonderhoud</h2><p class="sm">Vul per maand in wat jullie nu kwijt zijn en wat je in Spanje verwacht (bijv. na een reis of van andere emigranten).</p>
  <div class="card"><div class="row">${txt('col.r1','Regio 1',c.r1)}${txt('col.r2','Regio 2',c.r2)}</div></div>

  <tr><td><b>Totaal</b></td><td class="n"><b>${E(tot('nl'))}</b></td><td class="n"><b>${E(tot('r1'))}</b></td><td class="n"><b>${E(tot('r2'))}</b></td></tr></tbody></table>
  ${tot('nl')&&(tot('r1')||tot('r2'))?`<p class="lbl">Verschil per maand: ${esc(c.r1)} ${E(tot('r1')-tot('nl'))}, ${esc(c.r2)} ${E(tot('r2')-tot('nl'))}</p>`:''}</div>`},
t14:()=>{const cats=['Inrichting','Logo','Sfeer','Tuin'];const f=S.moodF||'';const list=S.mood.filter(m=>!f||m.cat===f);return `<h2>Moodboard</h2><div class="chips"><button class="chip" data-act="moodf" data-id="" style="${!f?'background:var(--blue);color:#fff':''}">Alles</button>${cats.map(c=>`<button class="chip" data-act="moodf" data-id="${c}" style="${f===c?'background:var(--blue);color:#fff':''}">${c}</button>`).join('')}</div>

  ${list.length?`<div class="mood">${list.map(m=>`<figure><img data-img="${m.img}" alt=""><figcaption><span>${esc(m.label||m.cat)}</span><button class="btn sm ghost" style="min-height:28px;padding:0 8px" data-act="delmood" data-id="${m.id}" aria-label="Verwijder">✕</button></figcaption></figure>`).join('')}</div>`:'<p class="lbl">Nog geen foto\'s. Voeg inspiratie toe voor de inrichting, het logo en de sfeer.</p>'}`},
t15:()=>{const ds=isApp()&&(()=>{try{return Android.deviceSecure()}catch(e){return false}})();return `<h2>Instellingen</h2><div class="card"><h3>Account</h3>${SB.hid?`<p>Ingelogd als <b>${esc(SB.email)}</b><br><span class="sm">Laatst ${syncText()}</span><br><span class="sm">Huishouden: ${SB.members.map(m=>esc(m.name||'Lid')).join(' · ')}${VAULT.on?' · versleuteld':''}</span></p><button class="btn ghost" data-act="sync">Nu synchroniseren</button> ${VAULT.key||!VAULT.on?'<button class="btn ghost" data-act="stuiver">Bedragen uit Stuiver halen</button>':''} <button class="btn ghost" data-act="logout">Uitloggen</button>`:`<p class="lbl">Je gebruikt de app zonder account; gegevens staan alleen op dit apparaat.</p><button class="btn" data-act="toauth">Inloggen met Stuiver-account</button>`}</div>
  ${isApp()?`<div class="card"><h3>Beveiliging</h3><p class="sm">Vergrendel de app als je hem opent of na een minuut op de achtergrond. Schermafbeeldingen worden dan ook geblokkeerd.</p><div class="chips">${[['off','Uit'],['device','Vingerafdruk / telefoonslot'],['pin','Eigen pincode']].map(([m,l])=>`<button class="chip" data-act="setlock" data-id="${m}" style="${LOCK.mode===m?'background:var(--blue);color:#fff;border-color:var(--blue)':''}">${l}</button>`).join('')}</div>${LOCK.mode!=='off'?`<p class="sm" style="margin:12px 0 0">Vergrendelen na</p><div class="chips">${[[0,'Direct'],[60,'1 minuut'],[300,'5 minuten'],[900,'15 minuten']].map(([v,l])=>`<button class="chip" data-act="locktime" data-id="${v}" style="${(LOCK.timeout??60)===v?'background:var(--blue);color:#fff':''}">${l}</button>`).join('')}</div>`:''}${!ds?'<p class="sm">Vingerafdruk werkt alleen als je telefoon zelf een schermvergrendeling heeft.</p>':''}</div>
  <div class="card"><h3>Meldingen</h3><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-act2="remind" ${localStorage.getItem('sp-remind')!=='0'?'checked':''}> Elke maand op de 25e een herinnering om de bedragen bij te werken</label><p class="sm">Je krijgt ook een melding de dag vóór een deadline en bij elke mijlpaal.</p><button class="btn ghost" data-act="notif">Meldingen toestaan</button></div>`:''}
  <div class="card"><h3>Back-up</h3><p class="sm">Een bestand met al je gegevens (zonder foto's). Handig om te bewaren of om terug te zetten.</p><button class="btn ghost" data-act="export">Back-up maken</button> <button class="btn ghost" data-act="import">Back-up terugzetten</button></div>
  <div class="card"><h3>App</h3><p>Versie ${APP_VN}${isApp()?'':' (webversie)'}</p>${isApp()?`<button class="btn ghost" data-act="checkupd">Zoeken naar updates</button>`:'<p class="sm">De Android-app vind je op <a href="https://github.com/thijsgame18-ui/spanje2031/raw/main/Spanje2031.apk">github.com/thijsgame18-ui/spanje2031</a>.</p>'}</div>`},
t17:()=>{const c=cashflow(),cf=Object.assign({ramp:[30,60,90,100,100],extra:0,dgKeep:0},S.cf||{}),mx=Math.max(1,...c.rows.map(r=>Math.abs(r.end)),Math.abs(c.start));
  return `<h2>Kasstroom 2031–2035</h2><div class="card" style="background:${c.broke?'var(--peach)':'var(--sage)'}"><div class="lbl">Scenario ${SCN_L[scKey()]}</div><div class="res">${c.broke?'Geld op in '+c.broke:'Na 5 jaar nog '+E(c.rows[4].end)}</div><div class="sm">${c.start<0?`Er is ${E(-c.start)} te weinig om de aankoop te betalen. Verbeter eerst de haalbaarheid (bij Financiën) of kies een goedkopere finca.`:`Na de aankoop blijft er ${E(c.start)} over. Zonder inkomen is dat ${isFinite(c.runway)?Math.floor(c.runway)+' maanden':'onbeperkt'} leven (${E(c.burn)} per maand aan vaste lasten${S.hypo.use||sc().hypo?', hypotheek':''} en premies).`}</div></div>
  <div class="card"><h3>Saldo per jaar</h3>${c.rows.map(r=>`<div style="display:grid;grid-template-columns:48px minmax(0,1fr) 96px;gap:8px;align-items:center;margin:6px 0"><span class="sm">${r.y}</span><div class="bar" style="margin:0"><i style="width:${Math.max(2,Math.abs(r.end)/mx*100)}%;background:${r.end<0?'var(--bad)':'var(--ok)'}"></i></div><span class="n" style="${r.end<0?'color:var(--bad)':''}">${E(r.end)}</span></div>`).join('')}
  <div class="scroll"><table style="margin-top:10px;font-size:13px"><thead><tr><th>Jaar</th><th class="n">B&amp;B netto</th><th class="n">Overig</th><th class="n">Uitgaven</th><th class="n">Eind</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${r.y}</td><td class="n">${E(r.bnb)}</td><td class="n">${E(r.div+r.huur+r.extra)}</td><td class="n">− ${E(r.out)}</td><td class="n"><b>${E(r.end)}</b></td></tr>`).join('')}</tbody></table></div>
  <p class="sm">B&B na kosten, inkomstenbelasting en autónomo-premie. Overig = dividend, huur van het huis in NL en ander inkomen. Uitgaven = vaste lasten uit Benodigde middelen${S.hypo.use||sc().hypo?' en hypotheek':''}.</p></div>
  <div class="card"><h3>Aannames</h3><p class="sm">Hoeveel van de volle B&B-omzet halen jullie per jaar? Een nieuwe B&B groeit meestal langzaam.</p><div class="row">${[0,1,2,3,4].map(i=>num(`cf.ramp.${i}`,'Jaar '+(i+1)+' (%)',cf.ramp[i])).join('')}</div>
  <div class="row" style="margin-top:10px">${num('cf.extra','Ander inkomen per maand (plan B)',cf.extra)}${num('cf.dgKeep','Blijft belegd voor dividend (€)',cf.dgKeep)}</div>
  <p class="sm">Wat belegd blijft, levert dividend op maar telt niet mee voor de aankoop. Huis verhuren in plaats van verkopen? Kies dat bij Financiën.</p></div>${tileTasks('t17')}`},
t18:()=>`<h2>Wensen en grenzen</h2><p class="sm">Wat moet er écht zijn, wat is fijn, en waar haken jullie af? Deze lijst komt terug bij elke finca en regio.</p>
  ${['must','nice','nogo'].map(k=>{const L=S.wishes.filter(w=>w.type===k);return `<div class="card" style="background:var(--${WT[k][1]})"><h3>${{must:'Moet',nice:'Fijn als het kan',nogo:'Absoluut niet'}[k]}</h3>${L.length?`<ul class="list">${L.map(w=>`<li><span style="flex:1">${esc(w.t)}${w.who?` <span class="badge">${esc(w.who)}</span>`:''}</span><button class="btn sm ghost" data-act="delwish" data-id="${w.id}" aria-label="Verwijder">✕</button></li>`).join('')}</ul>`:'<p class="sm">Nog niets.</p>'}</div>`}).join('')}
  <div class="card"><h3>Toevoegen</h3><div class="f"><label>Wens of grens</label><input type="text" id="wsT" placeholder="Bijv. max 30 minuten van een ziekenhuis"></div><div class="row" style="margin-top:10px"><div class="f"><label>Soort</label><select id="wsK"><option value="must">Moet</option><option value="nice">Fijn</option><option value="nogo">Absoluut niet</option></select></div><div class="f"><label>Van wie</label><select id="wsW"><option value="">Samen</option>${(SB.members.length>1?SB.members.map(m=>m.name):['Thijs','Amber']).map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><button class="btn" style="flex:0 0 auto" data-act="addwish">Toevoegen</button></div>
  <div class="chips">${['Max 30 min van ziekenhuis','Max 1 uur van vliegveld','Eigen water (put)','Geen buren binnen 200 m','Dorp met school in de buurt','Ruimte voor zwembad'].filter(x=>!S.wishes.some(w=>w.t===x)).map(x=>`<button class="chip" data-act="addwish" data-id="${esc(x)}">+ ${x}</button>`).join('')}</div></div>${tileTasks('t18')}`,
t16:()=>`<h2>Beslissingen</h2><p class="sm">Wat hebben we besloten, en waarom? Handig om later op terug te kijken.</p><div class="card"><div class="f"><label>Beslissing</label><input type="text" id="dcW" placeholder="Bijv. We zoeken in het binnenland van Andalusië"></div><div class="f" style="margin-top:10px"><label>Waarom</label><textarea id="dcR"></textarea></div><div class="row" style="margin-top:10px"><div class="f"><label>Datum</label><input type="date" id="dcD" value="${today()}"></div><button class="btn" style="flex:0 0 auto" data-act="adddec">Vastleggen</button></div></div>
  ${S.decisions.slice().sort((a,b)=>a.d<b.d?1:-1).map(d=>`<div class="card"><div class="sm">${fmtD(d.d)}${d.by?' · '+esc(d.by):''}</div><b style="font:400 18px var(--disp)">${esc(d.wat)}</b>${d.waarom?`<p style="margin:6px 0 0">${esc(d.waarom)}</p>`:''}<button class="btn sm ghost" style="margin-top:8px" data-act="deldec" data-id="${d.id}">Verwijderen</button></div>`).join('')||'<p class="lbl">Nog niets vastgelegd.</p>'}${tileTasks('t16')}`};
/* ---------- haalbaarheid met scenario's ---------- */
function feasCard(){const nd=needCalc(),hv=haveCalc(),fz=feas(),cur=scKey();
  const sc3=['somber','normaal','goed'].map(k=>withScen(k,()=>({k,f:feas(),max:maxFinca()})));
  return `<div class="card"><h3>Haalbaarheid 2031</h3>
  <div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0">${sc3.map(x=>`<button class="kpi" data-act="setscen" data-id="${x.k}" style="padding:12px;background:${x.k===cur?'var(--sea)':'var(--tint)'}"><div class="sm">${SCN_L[x.k]}</div><div class="v" style="font-size:28px;color:${x.f>=100?'var(--ok)':x.f>=70?'var(--bl)':'var(--bad)'}">${x.f}%</div><div class="sm">max finca ${x.max>1000?E(x.max):'past nog niet'}</div></button>`).join('')}</div>
  <p class="sm" style="margin:0">Tik op een scenario om daarmee te rekenen. Nu: <b>${SCN_L[cur]}</b>. "Max finca" is de hoogste vraagprijs van vandaag die jullie in dat scenario kunnen betalen.</p>${bar(fz,fz>=100?'g':'')}
  <div class="grid2" style="margin-top:8px"><div><div class="lbl">Nodig</div><table><tbody>${nd.rows.filter(r=>r[1]).map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${E(r[1])}</td></tr>`).join('')}<tr><td><b>Totaal</b></td><td class="n"><b>${E(nd.total)}</b></td></tr></tbody></table></div>
  <div><div class="lbl">Beschikbaar bij vertrek</div><table><tbody>${hv.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${r[1]?E(r[1]):'<span class="sm">uit</span>'}</td></tr>`).join('')}<tr><td><b>Totaal</b></td><td class="n"><b>${E(hv.total)}</b></td></tr></tbody></table></div></div>
  <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-bind="inclHouse" data-t="b" ${S.inclHouse?'checked':''}> Overwaarde huis NL meetellen${housePlan()==='verhuren'?' (niet bij verhuren)':` (${E(overwaarde())})`}</label><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-bind="hypo.use" data-t="b" ${S.hypo.use?'checked':''}> Spaanse hypotheek meetellen in Normaal (${S.hypo.ltv}% van de prijs)</label></div>
  <details style="margin-top:12px"><summary class="sm" style="cursor:pointer">Scenario's aanpassen</summary>${['somber','goed'].map(k=>{const d=Object.assign({},SCEN_DEF[k],(S.scen||{})[k]||{});return `<p style="margin:12px 0 4px"><b>${SCN_L[k]}</b></p><div class="row">${num(`scen.${k}.bez`,'Bezetting (+/− %-punt)',d.bez)}${num(`scen.${k}.prijs`,'Prijs per nacht (+/− %)',d.prijs)}${num(`scen.${k}.rend`,'Rendement % per jaar',d.rend)}${num(`scen.${k}.fin`,'Finca duurder/goedkoper %',d.fin)}${num(`scen.${k}.infl`,'Prijsstijging % per jaar',d.infl)}</div><label style="display:flex;gap:10px;align-items:center;margin-top:6px"><input type="checkbox" data-bind="scen.${k}.hypo" data-t="b" ${d.hypo?'checked':''}> Met Spaanse hypotheek</label>`}).join('')}<p class="sm">Normaal rekent met jullie eigen invoer.</p></details></div>`}
function paceCard(){const p=pace();return `<div class="card"><h3>Spaartempo</h3><div class="grid2"><div><div class="lbl">Nu per maand</div><div class="res">${E(p.inleg)}</div><div class="sm">ING ${E(S.inleg.ing)} + DeGiro ${E(S.inleg.degiro)}</div></div>
  <div><div class="lbl">Ten opzichte van schema</div><div class="res" style="color:${p.diff>=0?'var(--ok)':'var(--bad)'}">${p.diff>=0?'+':'−'}${E(Math.abs(p.diff))}</div><div class="sm">${p.diff>=0?'voor':'achter'} op de lijn naar je spaardoel</div></div></div>
  <table style="margin-top:10px"><tbody><tr><td>Extra per maand voor het spaardoel (${E(goalT())})</td><td class="n"><b>${p.goalExtra?E(p.goalExtra):'<span class="ok">niets</span>'}</b></td></tr><tr><td>Extra per maand voor 100% haalbaarheid (${SCN_L[scKey()]})</td><td class="n"><b>${p.needExtra?E(p.needExtra):'<span class="ok">niets</span>'}</b></td></tr></tbody></table>
  <p class="sm">Zonder rendement gerekend over de ${monthsLeft()} maanden tot vertrek.</p></div>`}
function deriskCard(){const d=Object.assign({on:false,start:2029,pct:25,rente:2},S.derisk||{});const yrs=projYears();return `<div class="card"><h3>Afbouwplan beleggingen</h3><p class="sm">Zet vanaf een bepaald jaar elk jaar in januari een deel van DeGiro op een spaarrekening. Zakt de beurs vlak voor vertrek, dan raakt dat een kleiner deel.</p>
  <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-bind="derisk.on" data-t="b" ${d.on?'checked':''}> Afbouwplan gebruiken</label>
  <div class="row" style="margin-top:8px">${num('derisk.start','Vanaf jaar',d.start)}${num('derisk.pct','% per jaar overzetten',d.pct)}${num('derisk.rente','Spaarrente %',d.rente)}</div>
  ${d.on?`<table style="margin-top:10px"><thead><tr><th>Moment</th><th class="n">Belegd</th><th class="n">Veilig gespaard</th></tr></thead><tbody>${yrs.filter(r=>r[0]==='Bij vertrek'||+r[0].slice(5)>=d.start-1).map(r=>`<tr><td>${r[0]}</td><td class="n">${E(r[1])}</td><td class="n">${E(r[3])}</td></tr>`).join('')}</tbody></table><p class="sm">${isApp()?'Je krijgt elk jaar op 2 januari een herinnering.':''}</p>`:''}</div>`}
function houseCard(){const h=S.house,plan=housePlan(),hn=huurNet();return `<div class="card"><h3>Huis in Nederland: verkopen of verhuren?</h3><div class="chips">${[['verkopen','Verkopen'],['verhuren','Verhuren']].map(([k,l])=>`<button class="chip" data-act="houseplan" data-id="${k}" style="${plan===k?'background:var(--blue);color:#fff':''}">${l}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px">${num('house.huur','Huur per maand',h.huur??1800)}${num('house.huurKost','Kosten verhuur % (beheer, onderhoud)',h.huurKost??25)}${num('house.hypoLast','Hypotheeklast per maand',h.hypoLast??1500)}</div>
  <div class="grid2" style="margin-top:10px"><div style="${plan==='verkopen'?'':'opacity:.6'}"><div class="lbl">Verkopen</div><div class="res">${E(overwaarde())}</div><div class="sm">eenmalig vrij bij vertrek</div></div><div style="${plan==='verhuren'?'':'opacity:.6'}"><div class="lbl">Verhuren</div><div class="res" style="color:${hn>=0?'var(--ok)':'var(--bad)'}">${E(hn)} p/m</div><div class="sm">netto, telt mee in de kasstroom; huis blijft van jullie</div></div></div>
  <p class="sm">Verhuren is veiliger als Spanje tegenvalt, maar dan heb je de overwaarde niet voor de finca. Voor verhuren heb je toestemming van je hypotheekbank nodig, en je betaalt belasting in Nederland én Spanje. Laat dit doorrekenen door een adviseur.</p></div>`}

async function stuiverRead(){if(!SB.hid)throw new Error('Log eerst in met je Stuiver-account');if(VAULT.on&&!VAULT.key)throw new Error('Kluis is nog vergrendeld');
  const {data,error}=await SB.c.from('docs').select('key,data').eq('household_id',SB.hid).or('key.eq.main,key.like.tx-*');if(error)throw error;
  let main=null;const tx=[];for(const r of data||[]){let d=r.data;if(d&&d.enc){try{d=await vDec(d)}catch(e){continue}}if(r.key==='main')main=d;else if(d&&Array.isArray(d.items))tx.push(...d.items)}
  if(!main)throw new Error('Geen Stuiver-gegevens gevonden');
  const hit=(a,t)=>{if(a.cat&&(t.cat===a.cat||(Array.isArray(t.splits)&&t.splits.some(x=>x.cat===a.cat))))return true;if(a.match){const m=a.match.toLowerCase().replace(/\s/g,''),h=((t.desc||'')+' '+(t.note||'')).toLowerCase().replace(/\s/g,'');if(m.length>=3&&h.includes(m))return true}return false};
  const bal=a=>{const since=a.updated||'0000';let b=+a.amount||0;if(a.cat||a.match){const seen=new Set(a.updIds||[]);tx.forEach(t=>{if((t.date>since||(t.date===since&&!seen.has(t.id)))&&hit(a,t))b+=t.type==='out'?t.amount:-t.amount})}return b};
  const assets=main.assets||[],spaar=assets.filter(a=>a.type==='spaar').map(a=>({id:a.id,name:a.name,bal:Math.round(bal(a)*100)/100}));
  const dgA=assets.find(a=>a.src==='degiro'||(a.type==='beleg'&&/degiro/i.test(a.name||''))),G=main.degiro||{};const dg=Math.round((G.val||(dgA&&dgA.amount)||0)*100)/100;
  const cut=new Date();cut.setFullYear(cut.getFullYear()-1);const cs=cut.toISOString().slice(0,10);const div12=(G.div||[]).filter(e=>e.d>=cs).reduce((a,e)=>a+(+e.eur||0),0);
  return STV={spaar,dg,div:Math.round(div12/12*100)/100,divYear:div12}}
function stuiverSel(){const st=S.stuiver||{};if(Array.isArray(st.accts))return st.accts;return (STV?STV.spaar:[]).filter(a=>/espon|spanje|espa/i.test(a.name||'')).map(a=>a.id)}
function stuiverApply(sel){if(!STV)return false;const ing=STV.spaar.filter(a=>sel.includes(a.id)).reduce((s,a)=>s+a.bal,0),ch=Math.round(ing)!==Math.round(S.acc.ing)||Math.round(STV.dg)!==Math.round(S.acc.degiro);
  S.acc.ing=Math.round(ing*100)/100;if(STV.dg)S.acc.degiro=STV.dg;if(STV.div)S.divi=STV.div;if(ch){S.upd=today();S.hist=S.hist.filter(h=>h.d!==S.upd).concat({id:S.upd,d:S.upd,t:total()})}return ch}
async function stuiverOpen(){toast('Gegevens uit Stuiver ophalen…');try{await stuiverRead()}catch(e){toast(e.message||'Ophalen mislukt');return}const sel=stuiverSel();

  ${id&&x.prijs?`<button class="btn ghost" style="margin-top:8px" data-act="usefinca" data-id="${id}">Gebruik deze prijs in het budget</button>`:''}
  <div class="actions">${id?`<button class="btn red" data-act="delfinca" data-id="${id}">Verwijderen</button>`:''}<button class="btn ghost" data-act="close">Annuleren</button><button class="btn" data-act="savefinca">Opslaan</button></div>`);loadImgs()}
function editComp(id){const c=id?S.comp.find(x=>x.id===id):{};openSheet(`<h3>${id?'B&B':'B&B toevoegen'}</h3>${['naam:Naam','regio:Regio','url:Link'].map(s=>{const[k,l]=s.split(':');return `<div class="f" style="margin-top:10px"><label>${l}</label><input type="text" id="cp_${k}" value="${esc(c[k]||'')}"></div>`}).join('')}
  <div class="row" style="margin-top:10px"><div class="f"><label>Prijs per nacht (€)</label><input type="number" id="cp_prijs" value="${c.prijs||''}"></div><div class="f"><label>Bezetting % (schatting)</label><input type="number" id="cp_bez" value="${c.bez||''}"></div></div>
  <div class="f" style="margin-top:10px"><label>Wat doen ze goed?</label><textarea id="cp_note">${esc(c.note||'')}</textarea></div>${c.url?`<p><a href="${esc(c.url)}">Website openen</a></p>`:''}
  <div class="actions">${id?`<button class="btn red" data-act="delcomp" data-id="${id}">Verwijderen</button>`:''}<button class="btn ghost" data-act="close">Annuleren</button><button class="btn" data-act="savecomp" data-id="${id||''}">Opslaan</button></div>`)}
function editPlan(id){const it=S.plan.items.find(x=>x.id===id);if(!it)return;openSheet(`<h3>${esc(it.label||PLANTYPES[it.type][0])}</h3><div class="f" style="margin-top:10px"><label>Naam</label><input type="text" id="plL" value="${esc(it.label||'')}"></div><div class="row" style="margin-top:10px"><div class="f"><label>Breedte (m)</label><input type="number" id="plW" value="${it.w}"></div><div class="f"><label>Diepte (m)</label><input type="number" id="plH" value="${it.h}"></div></div>
  <div class="actions"><button class="btn red" data-act="delplan" data-id="${id}">Verwijderen</button><button class="btn ghost" data-act="close">Annuleren</button><button class="btn" data-act="saveplan" data-id="${id}">Opslaan</button></div>`)}

/* ---------- acties ---------- */
const val=id=>($(id)||{}).value||'';
const A0={
login:doLogin,localmode:()=>{try{localStorage.setItem('sp-local','1')}catch(e){}render()},vault:()=>doVault(false),vaultrc:()=>doVault(true),logout:doLogout,toauth:()=>{try{localStorage.removeItem('sp-local')}catch(e){}showAuth()},
sync:()=>{dirty=true;flush();pull().then(()=>toast('Gesynchroniseerd')).catch(()=>toast('Niet gelukt, probeer later'))},
update:()=>{if(!UPD)return;try{Android.installUpdate(UPD.apk);toast('Update wordt gedownload…')}catch(e){location.href=UPD.apk}},
checkupd:()=>{checkUpdate().then(()=>{if(!UPD)toast('Je hebt de nieuwste versie')})},notif:()=>{try{Android.requestNotifPermission();toast('Meldingen gevraagd')}catch(e){}},
close:closeSheet,clearcele:()=>{delete S.celebrate;save();render()},
addtask:id=>{const t=val('nt-'+id).trim();if(!t)return;S.custom.push({id:'u'+uid(),t,f:+val('nf-'+id),tile:id});save();render();toast('Taak toegevoegd')},
edittask:editTask,
savetask:id=>{const m={due:val('etD'),who:val('etW')};if(m.due||m.who)S.tmeta[id]=m;else delete S.tmeta[id];const c=S.custom.find(x=>x.id===id);if(c){c.t=val('etT')||c.t;c.f=+val('etF')||c.f}closeSheet();save();render()},
deltask:id=>{S.custom=S.custom.filter(x=>x.id!==id);S.done=S.done.filter(x=>x!==id);delete S.tmeta[id];closeSheet();save();render()},
adddiv:()=>{const a=parseFloat(val('dvA'));if(!a)return toast('Vul een bedrag in');S.divlog.push({id:'d'+uid(),d:val('dvD')||today(),amt:a,note:val('dvN')});save();render()},
deldiv:id=>{S.divlog=S.divlog.filter(x=>x.id!==id);save();render()},
niveau:id=>{S.niveau=id;save();render()},
addles:()=>{const m=+val('lsM');if(!m)return;S.lessen.push({id:'l'+uid(),d:val('lsD')||today(),min:m,note:val('lsN')});save();render()},
delles:id=>{S.lessen=S.lessen.filter(x=>x.id!==id);save();render()},
addreg:id=>{const n=(id||val('rgN')).trim();if(!n)return;S.regions.push({id:'r'+uid(),naam:n,s:{},note:''});save();render()},
delreg:id=>{S.regions=S.regions.filter(x=>x.id!==id);save();render()},
edittrip:editTrip,tripfoto:()=>{readTrip();pickPhotos(true,ids=>{draft.fotos.push(...ids);tripSheet()})},
tripdelfoto:id=>{readTrip();draft.fotos=draft.fotos.filter(f=>f!==id);delImg(id);tripSheet()},
savetrip:()=>{readTrip();const t=draft;delete t.nw;const i=S.trips.findIndex(x=>x.id===t.id);if(i>=0)S.trips[i]=t;else S.trips.push(t);closeSheet();save();render()},
deltrip:()=>{(draft.fotos||[]).forEach(delImg);S.trips=S.trips.filter(x=>x.id!==draft.id);closeSheet();save();render()},
editfinca:editFinca,fincafoto:()=>pickPhotos(false,ids=>{if(draft.foto)delImg(draft.foto);draft.foto=ids[0];$('fiFoto').innerHTML=`<img data-img="${ids[0]}" class="ph" style="width:120px" alt="">`;loadImgs()}),
savefinca:()=>{const g=k=>val('fi_'+k);const x={id:draft.id,foto:draft.foto,naam:g('naam'),regio:g('regio'),url:g('url'),prijs:+g('prijs')||0,grond:g('grond'),status:g('status'),note:g('note'),check:Object.fromEntries(CHECKS.map(([k])=>[k,!!($('ck_'+k)||{}).checked])),wish:Object.fromEntries(S.wishes.map(w=>[w.id,!!($('fw_'+w.id)||{}).checked]))};const i=S.fincas.findIndex(f=>f.id===x.id);if(i>=0)S.fincas[i]=x;else S.fincas.push(x);closeSheet();save();render()},
delfinca:id=>{const f=S.fincas.find(x=>x.id===id);if(f&&f.foto)delImg(f.foto);S.fincas=S.fincas.filter(x=>x.id!==id);closeSheet();save();render()},
editcomp:editComp,savecomp:id=>{const g=k=>val('cp_'+k);const x={id:id||'c'+uid(),naam:g('naam')||'B&B',regio:g('regio'),url:g('url'),prijs:+g('prijs')||0,bez:+g('bez')||0,note:g('note')};const i=S.comp.findIndex(c=>c.id===x.id);if(i>=0)S.comp[i]=x;else S.comp.push(x);closeSheet();save();render()},
delcomp:id=>{S.comp=S.comp.filter(x=>x.id!==id);closeSheet();save();render()},
addplan:type=>{const t=PLANTYPES[type];S.plan.items.push({id:'p'+uid(),type,x:Math.max(0,S.plan.w/2-t[2]/2),y:Math.max(0,S.plan.h/2-t[3]/2),w:t[2],h:t[3],label:''});save();render()},
saveplan:id=>{const it=S.plan.items.find(x=>x.id===id);it.label=val('plL');it.w=+val('plW')||it.w;it.h=+val('plH')||it.h;closeSheet();save();render()},
delplan:id=>{S.plan.items=S.plan.items.filter(x=>x.id!==id);closeSheet();save();render()},
moodf:id=>{S.moodF=id;saveLocal();render()},addmood:()=>{const cat=val('mdC');pickPhotos(true,ids=>{ids.forEach(img=>S.mood.push({id:'m'+uid(),img,cat,label:''}));save();render()})},
setlock:setLock,usemarkt:()=>{S.finca.prijs=MARKT.streef;save();render();toast('Finca-budget: '+E(MARKT.streef))},setscen:k=>{S.scen=S.scen||{};S.scen.cur=k;save();render();toast('Rekenen met scenario '+SCN_L[k])},
houseplan:k=>{S.house.plan=k;save();render()},
addwish:t=>{const x=(t||val('wsT')).trim();if(!x)return toast('Vul een wens of grens in');S.wishes.push({id:'w'+uid(),t:x,type:t?'must':val('wsK')||'must',who:t?'':val('wsW')});save();render()},
delwish:id=>{S.wishes=S.wishes.filter(w=>w.id!==id);save();render()},
regwish:k=>{const [rid,wid]=k.split('|');const r=S.regions.find(x=>x.id===rid);if(!r)return;r.wish=r.wish||{};r.wish[wid]=!r.wish[wid];save();render()},
ckstart:()=>{CK.step=0;ckSheet()},cknext:ckNext,ckprev:()=>{CK.step=Math.max(0,CK.step-1);ckSheet()},ckdone:ckDone,
stuiver:stuiverOpen,stuiverck:async()=>{try{await stuiverRead();const sel=stuiverSel();const ing=STV.spaar.filter(a=>sel.includes(a.id)).reduce((s,a)=>s+a.bal,0);$('ckI').value=Math.round(ing*100)/100;if(STV.dg)$('ckD').value=STV.dg;if(STV.div)$('ckV').value=STV.div;toast('Overgenomen uit Stuiver')}catch(e){toast(e.message||'Ophalen mislukt')}},
stuiverok:()=>{const sel=[...document.querySelectorAll('[data-sv]')].filter(x=>x.checked).map(x=>x.dataset.sv);S.stuiver={accts:sel,auto:$('svAuto').checked};stuiverApply(sel);closeSheet();save();render();toast('Bedragen bijgewerkt uit Stuiver')},
locktime:v=>{LOCK.timeout=+v;saveLock();render();toast('Opgeslagen')},tf:k=>{TF=k||'';render()},vclose:()=>closeViewer(),vprev:()=>stepViewer(-1),vnext:()=>stepViewer(1),savepin:savePin,pin:pinKey,devauth:()=>{try{Android.deviceAuth()}catch(e){}},
pinforgot:()=>{openSheet(`<h3>Pincode vergeten?</h3><p>Log uit en daarna weer in met je Stuiver-account. De vergrendeling gaat dan uit.</p><div class="actions"><button class="btn ghost" data-act="close">Annuleren</button><button class="btn red" data-act="forgotok">Uitloggen</button></div>`)},
forgotok:()=>{LOCK={mode:'off',timeout:60};saveLock();unlock();doLogout()},
export:exportData,import:importData,restore:()=>{if(!BK)return;S=Object.assign(defaults(),BK);BK=null;setBase(null);closeSheet();save();render();toast('Back-up teruggezet')},
adddec:()=>{const w=val('dcW').trim();if(!w)return toast('Vul een beslissing in');const me=(SB.members.find(m=>m.user_id===SB.uid)||{}).name||'';S.decisions.push({id:'b'+uid(),d:val('dcD')||today(),wat:w,waarom:val('dcR'),by:me});save();render()},
deldec:id=>{S.decisions=S.decisions.filter(x=>x.id!==id);save();render()},
usefinca:id=>{const f=S.fincas.find(x=>x.id===id);if(f){S.finca.prijs=+f.prijs||S.finca.prijs;closeSheet();save();render();toast('Prijs gebruikt in het finca-budget')}},
delmood:id=>{const m=S.mood.find(x=>x.id===id);if(m)delImg(m.img);S.mood=S.mood.filter(x=>x.id!==id);save();render()}};

const DELMSG={delwish:'Wens verwijderd',deldiv:'Dividend verwijderd',delles:'Les verwijderd',delreg:'Regio verwijderd',deltrip:'Reis verwijderd',delfinca:'Finca verwijderd',delcomp:'B&B verwijderd',delplan:'Blok verwijderd',delmood:'Foto verwijderd',deldec:'Beslissing verwijderd',deltask:'Taak verwijderd'};
const A=new Proxy(A0,{get(o,k){if(k==='undo')return()=>{if(!UNDO)return;S=UNDO;UNDO=null;PENDEL=[];$('toast').style.display='none';save();render();toast('Teruggezet')};
  if(DELMSG[k]&&o[k])return id=>{PENDEL.forEach(f=>f());PENDEL=[];UNDO=clone(S);o[k](id);toastUndo(DELMSG[k])};return o[k]}});
/* ---------- render + events ---------- */
const app=$('app');let lastView=null;
function render(){if(!$('app'))return;if(SB.c&&!SB.uid&&!localStorage.getItem('sp-local')&&window.supabase){showAuth();return}
  const id=location.hash.slice(1),y=id===lastView?window.scrollY:0;app.innerHTML=(V[id]?page(id):home())+nav(V[id]?id:'');lastView=id;window.scrollTo(0,y);setSync(SB.state);drawChart();loadImgs()}
addEventListener('resize',()=>drawChart());
app.addEventListener('toggle',e=>{if(e.target.id==='qe')qOpen=e.target.open},true);
let VW={ids:[],i:0};
function openViewer(im){const box=im.closest('.photos,.mood');VW.ids=[...box.querySelectorAll('img[data-img]')].map(x=>x.dataset.img);VW.i=Math.max(0,VW.ids.indexOf(im.dataset.img));$('viewer').classList.add('on');drawViewer()}
function drawViewer(){const n=VW.ids.length;$('viewer').innerHTML=`<img id="vimg" alt="">${n>1?`<button class="vb" style="left:10px;top:50%" data-act="vprev" aria-label="Vorige">‹</button><button class="vb" style="right:10px;top:50%" data-act="vnext" aria-label="Volgende">›</button>`:''}<button class="vb" style="right:12px;top:calc(12px + env(safe-area-inset-top))" data-act="vclose" aria-label="Sluiten">✕</button><div class="vc">${VW.i+1} van ${n}</div>`;getImg(VW.ids[VW.i]).then(u=>{const el=$('vimg');if(u&&el)el.src=u})}
function stepViewer(d){const n=VW.ids.length;if(!n)return;VW.i=(VW.i+d+n)%n;drawViewer()}
function closeViewer(){$('viewer').classList.remove('on');$('viewer').innerHTML=''}
let tx0=null;$('viewer').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});$('viewer').addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)stepViewer(dx<0?1:-1)});
document.addEventListener('click',e=>{const im=e.target.closest('.photos img[data-img],.mood img[data-img]');if(im&&!e.target.closest('[data-act]:not(.card)')&&!im.closest('#sheet')){e.stopPropagation();openViewer(im);return}
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){e.preventDefault();A[a.dataset.act](a.dataset.id)}});
function bindVal(t){const r=getRef(t.dataset.bind);if(!r)return false;let v;if(t.dataset.t==='b')v=t.checked;else if(t.dataset.t==='s')v=t.value;else v=t.value===''?null:+t.value;
  if(v===null&&t.dataset.bind.startsWith('costs.'))delete r.o[r.k];else r.o[r.k]=v;return true}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.task){setDone(t.dataset.task,t.checked);save();render();return}
  if(t.dataset.act2==='remind'){try{localStorage.setItem('sp-remind',t.checked?'1':'0')}catch(e){}scheduleMonthly();toast(t.checked?'Herinnering staat aan':'Herinnering uit');return}
  if(t.dataset.bind){if(t.dataset.bind.startsWith('derisk.')||t.dataset.bind.startsWith('scen.'))setTimeout(scheduleExtra,0);if(t.dataset.bind.startsWith('regw.')){S.regw=S.regw||{}}if(t.dataset.bind.startsWith('scen.')){const k=t.dataset.bind.split('.')[1];S.scen=S.scen||{cur:'normaal'};S.scen[k]=Object.assign({},SCEN_DEF[k],S.scen[k]||{})}if(t.dataset.bind.startsWith('derisk.'))S.derisk=Object.assign({on:false,start:2029,pct:25,rente:2},S.derisk||{});if(t.dataset.bind.startsWith('cf.'))S.cf=Object.assign({ramp:[30,60,90,100,100],extra:0,dgKeep:0},S.cf||{});if(t.dataset.bind.startsWith('col.v.')){const k=t.dataset.bind.split('.')[2];S.col.v[k]=S.col.v[k]||{}}
    if(bindVal(t)){save();if(!t.dataset.norr)render()}}});
document.addEventListener('submit',e=>{const m=e.target.closest('[data-form="money"]');if(!m)return;e.preventDefault();const v=n=>{const x=parseFloat(String(m.elements[n].value).replace(',','.'));return isNaN(x)?0:x};
  S.acc={ing:v('ing'),degiro:v('degiro')};S.divi=v('divi');S.inleg={ing:v('iing'),degiro:v('ideg')};S.upd=today();
  S.hist=S.hist.filter(h=>h.d!==S.upd).concat({id:S.upd,d:S.upd,t:total()});qOpen=false;save();render();toast('Bedragen opgeslagen')});
/* plattegrond slepen */
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-pi]');if(!g)return;const svg=$('plan');const it=S.plan.items.find(x=>x.id===g.dataset.pi);const pt=svgPt(svg,e);drag={it,dx:pt.x-it.x,dy:pt.y-it.y,moved:false,g};g.setPointerCapture&&g.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const pt=svgPt($('plan'),e),it=drag.it;const nx=Math.max(0,Math.min(S.plan.w-it.w,pt.x-drag.dx)),ny=Math.max(0,Math.min(S.plan.h-it.h,pt.y-drag.dy));if(Math.abs(nx-it.x)+Math.abs(ny-it.y)>.3)drag.moved=true;it.x=Math.round(nx*2)/2;it.y=Math.round(ny*2)/2;
  const r=drag.g.querySelector('rect'),tx=drag.g.querySelector('text');r.setAttribute('x',it.x);r.setAttribute('y',it.y);tx.setAttribute('x',it.x+it.w/2);tx.setAttribute('y',it.y+it.h/2+1)});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.moved)save();else editPlan(d.it.id)});
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
addEventListener('hashchange',render);
if(migrate())saveLocal();lockNow();render();initSB().catch(()=>render());setTimeout(checkUpdate,4000);scheduleDeadlines();scheduleMonthly();scheduleExtra();if(isApp()&&LOCK.mode!=='off'){try{Android.setSecure(true)}catch(e){}}
if(isApp()&&!localStorage.getItem('sp-notifasked')){try{Android.requestNotifPermission();localStorage.setItem('sp-notifasked','1')}catch(e){}}
</script>
